[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "design-outline-tracer-backend"
version = "0.1.0"
description = "FastAPI backend for CAD-aware roof-plan extraction."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "pymupdf>=1.24,<2",
  "pdfplumber>=0.11,<1",
  "opencv-python-headless>=4.9,<5",
  "scikit-image>=0.23,<1",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "shapely>=2,<3",
  "ezdxf>=1.3,<2",
  "svgwrite>=1.4,<2",
  "google-generativeai>=0.8,<1",
  "openai>=1,<3",
  "mistralai>=1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "coverage>=7,<8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: full pipeline or live-provider tests skipped by default",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
